<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=initial-scale, initial-scale=1.0">

    <title>User Dahboard</title>

    <link rel="stylesheet" href="../style.css">
</head>

<div class="dashboard-page">
    <!-- Sidebar Component-->
    <div id="sidebar"></div>
    <!-- Main Area -->
    <div class="dashboard-main">
        <!-- Navbar Component-->
        <div id="navbar"></div>
            <!-- Dashboard Content -->
              <main class="dashboard-container">
                    <!-- Welcome Section -->
                    <div class="welcome-section">
                        <h1>Welcome, <span id="welcomeName">User</span></h1>
                        <p>Track your incidents</p>
                    </div>

                    <!-- Dashboard Overview -->
                    <div class="dashboard-section">
                        <h2>Dashboard Overview</h2>
                        <div class="dashboard-cards">
                            <div class="dashboard-card">
                                <h3>Total Incidents</h3>
                                <p id="totalIncidents">
                                    0
                                </p>
                            </div>
                            <div class="dashboard-card">
                                <h3>Open</h3>
                                <p id="openInciddents">
                                    0
                                </p>
                            </div>
                            <div class="dashboard-card">
                                <h3>Progress</h3>
                                <p id="inProgressIncidents">
                                    0
                                </p>
                            </div>
                            <div class="dashboard-card">
                                <h3>Closed</h3>
                                <p id="closedIncidents">
                                    0
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
    </div>      
    <script src="../scripts/auth.js"></script>   
    <script src="../scripts/common.js"></script>   
    <script src="dashboard.js"></script>
</html>
